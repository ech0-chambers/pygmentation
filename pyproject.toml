[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pygmentation"
version = "0.1.4"
authors = [
    {name = "Peter Brookes Chambers"}
]
description = "A quality-of-life package for colour schemes/palettes and matplotlib plots."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy",
    "rich",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.5", "cycler>=0.11"]
dev = ["pytest>=7.0", "pytest-cov", "ruff", "mypy"]


[project.urls]
Homepage = "https://github.com/ech0-chambers/pygmentation"

[project.scripts]
pygmentation = "pygmentation.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pygmentation = ["color_schemes.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort imports
    "B",   # flake8-bugbear
    "UP",  # pyupgrade (modern language features)
]
ignore = [
    "E501",
    "E741",
    "E743"
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
